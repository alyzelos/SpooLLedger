name: 🚀 Deploy SpoolLedger

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Stop Running Backend Service
      shell: cmd
      run: |
        sc query SpooLLedgerBE | findstr /C:"STATE" | findstr RUNNING
        if %errorlevel% equ 0 (
          echo Stopping SpooLLedgerBE...
          sc stop SpooLLedgerBE
          set /a tries=0
          :waitstop
          set /a tries+=1
          if %tries% gtr 30 exit /b 1
          ping 127.0.0.1 -n 3 > nul
          sc query SpooLLedgerBE | findstr /C:"STOPPED"
          if errorlevel 1 goto waitstop
        ) else (
          echo SpooLLedgerBE is not running.
        )
        taskkill /F /IM SpooLLedger.exe /T 2>nul
        echo Cleared any leftover SpooLLedger.exe processes.

    - name: Publish .NET Backend
      shell: cmd
      run: |
        dotnet publish ./SpooLLedger/SpooLLedger.csproj -c Release -o C:\MyApps\SpooLLedger\SpooLLedger\backend --nologo
        if %errorlevel% neq 0 exit /b %errorlevel%
        sc config SpooLLedgerBE binPath= "C:\MyApps\SpooLLedger\SpooLLedger\backend\SpooLLedger.exe"
        if %errorlevel% neq 0 exit /b %errorlevel%

    - name: Install Angular Dependencies and Build
      shell: cmd
      run: |
        cd client
        call npm install
        if %errorlevel% neq 0 exit /b %errorlevel%
        call npm run build
        if %errorlevel% neq 0 exit /b %errorlevel%
        if not exist C:\MyApps\SpooLLedger\SpooLLedger\backend\wwwroot mkdir C:\MyApps\SpooLLedger\SpooLLedger\backend\wwwroot
        xcopy /E /Y /I dist\client\browser\* C:\MyApps\SpooLLedger\SpooLLedger\backend\wwwroot\
        if %errorlevel% geq 4 exit /b %errorlevel%

    - name: Start Backend Service
      shell: cmd
      run: |
        sc start SpooLLedgerBE
        if %errorlevel% neq 0 exit /b %errorlevel%
        set /a tries=0
        :waitstart
        set /a tries+=1
        if %tries% gtr 30 exit /b 1
        ping 127.0.0.1 -n 3 > nul
        sc query SpooLLedgerBE | findstr /C:"RUNNING"
        if errorlevel 1 goto waitstart

    - name: Deployment Completed
      shell: cmd
      run: echo Application deployed to C:\MyApps\SpooLLedger\SpooLLedger\backend and SpooLLedgerBE is running.
